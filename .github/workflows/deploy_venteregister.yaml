name: deploy venteregister union tasks to production
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy_venteregister.yaml"
      - "tasks/task_run_dbt_venteregister.py"
      - "tasks/task_dbt_docs_venteregister.py"
      - "tasks/task_clean_stoppstatus_snapshot.py"
      - "tasks/requirements/**"
      - "dbt_venteregister/**"
  workflow_dispatch:

jobs:
  deploy_task_run_dbt_venteregister:
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/deploy.yaml@v2
    with:
      working-directory: ./tasks/
      flyte-task-file: task_run_dbt_venteregister.py
      dependency-file: requirements/requirements_dbt.txt
      union-project: utsikt
      union-domain: production

  deploy_task_clean_stoppstatus_snapshot:
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/deploy.yaml@v2
    with:
      working-directory: ./tasks/
      flyte-task-file: task_clean_stoppstatus_snapshot.py
      dependency-file: requirements/requirements_python.txt
      union-project: utsikt
      union-domain: production

  deploy_task_generate_docs:
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/deploy.yaml@v2
    with:
      working-directory: ./tasks/
      flyte-task-file: task_dbt_docs_venteregister.py
      dependency-file: requirements/requirements_dbt.txt
      union-project: utsikt
      union-domain: production

  run_task_generate_docs:
    needs: deploy_task_generate_docs
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/run.yaml@run-v1
    with:
      union-project: utsikt
      union-domain: production
      task-environment: dbt_venteregister_environment
      task-name: dbt_venteregister_environment.run_dbt_docs_venteregister
