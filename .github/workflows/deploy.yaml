name: deploy union tasks to production
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yaml'
      - 'tasks/**'
      - 'dbt_utsikt/**'
  workflow_dispatch:

jobs:
  deploy_task_run_dbt:
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/deploy.yaml@8ad9391907b524b679f7cf8a09c299bb23882ef5 #v2
    with:
      flyte-task-file: ./tasks/run_dbt/task_run_dbt.py
      dependency-file: ./tasks/run_dbt/requirements.txt
      union-project: utsikt
      union-domain: production

  deploy_task_clean_stoppstatus_snapshot:
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/deploy.yaml@8ad9391907b524b679f7cf8a09c299bb23882ef5 #v2
    with:
      flyte-task-file: ./tasks/clean_stoppstatus_snapshot/task_clean_stoppstatus_snapshot.py
      dependency-file: ./tasks/clean_stoppstatus_snapshot/requirements.txt
      union-project: utsikt
      union-domain: production

  deploy_task_generate_docs:
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/deploy.yaml@8ad9391907b524b679f7cf8a09c299bb23882ef5 #v2
    with:
      flyte-task-file: ./tasks/dbt_docs/task_dbt_docs.py
      dependency-file: ./tasks/dbt_docs/requirements.txt
      union-project: utsikt
      union-domain: production

  run_task_generate_docs:
    needs: deploy_task_generate_docs
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/run.yaml@4972b3c93ad2e5c097939afe5b9e729b36bc9033 #v1
    with:
      union-project: utsikt
      union-domain: production
      task-environment: dbt_docs_environment
      task-name: dbt_docs_environment.main
