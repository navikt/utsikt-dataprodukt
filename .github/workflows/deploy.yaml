name: deploy union tasks to production
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yaml'
      - 'tasks/**'
      - 'dbt_venteregister/**'
  workflow_dispatch:

jobs:
  deploy_task_run_dbt:
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/deploy.yaml@v2
    with:
      working-directory: ./tasks/run_dbt/
      flyte-task-file: task_run_dbt.py
      dependency-file: requirements.txt
      union-project: utsikt
      union-domain: production

  deploy_task_clean_stoppstatus_snapshot:
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/deploy.yaml@v2
    with:
      working-directory: ./tasks/clean_stoppstatus_snapshot
      flyte-task-file: task_clean_stoppstatus_snapshot.py
      dependency-file: requirements.txt
      union-project: utsikt
      union-domain: production

  deploy_task_generate_docs:
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/deploy.yaml@v2
    with:
      working-directory: ./tasks/dbt_docs/
      flyte-task-file: task_dbt_docs.py
      dependency-file: requirements.txt
      union-project: utsikt
      union-domain: production

  run_task_generate_docs:
    needs: deploy_task_generate_docs
    permissions:
      contents: read
      id-token: write
    uses: navikt/union-deploy/.github/workflows/run.yaml@run-v1
    with:
      union-project: utsikt
      union-domain: production
      task-environment: dbt_docs_environment
      task-name: dbt_docs_environment.main
