version: 2

models:
  - name: agg_belop_per_fagomrade_maned
    description: 'Bruttobeløp per fagområde og måned.'
    columns:
      - name: fagomrade_navn
        description: 'Navn/beskrivelse på fagområde'
      - name: faggruppe_navn
        description: 'Navn/beskrivelse på faggruppe'
      - name: maned_dato
        description: 'første dato i måneden aggregeringen gjelder for'
      - name: belop_brutto
        description: 'Brutto beløp for stoppnivået. Regnet ut ved å summere beløp fra stoppnivaer_detaljer where linje_id > 0'
  - name: agg_beregninger_per_faggruppe_dag
    description: 'Antall beregninger per faggruppe per beregnet dato'
    columns:
      - name: faggruppe_kode
        description: 'Kode for faggruppe. En faggruppe består av flere fagområder hvor man ønsker en samlet felles skatt- og trekkberegning. F.eks. PEN for pensjonsrelaterte ytelser'
      - name: faggruppe_navn
        description: 'Navn/beskrivelse på faggruppe'
      - name: beregnet_dato
        description: 'Datoen beregningen er utført i Oppdragssystemet.'
      - name: antall_beregninger
        description: 'Antall beregninger'
  - name: agg_beregninger_per_ventestatus_varighet_fagomrade_enhet
    description: 'Antall beregninger per ventestatus, varighet, fagområde og enhet. Også gruppert på gjeldende_flagg og handteres_manuelt_flagg'
    columns:
      - name: ventestatus_beskrivelse
        description: 'Beskrivelse av ventestatuskode, eks Overført til UR'
      - name: ventestatus_kode
        description: 'Kode for ventestatus. F.eks OVFO (for Overført til UR)'
      - name: fagomrade_kode
        description: 'En kode som angir selve ytelsen som beregningen gjelder, f.eks. AAP for arbeidsavklaringspenger'
      - name: fagomrade_navn
        description: 'Navn/beskrivelse på fagområde'
      - name: faggruppe_navn
        description: 'Navn/beskrivelse på faggruppe'
      - name: enhet_behandler
        description: 'Enhet som behandler stoppnivået. 4819 for NØP og 8020 for NØS'
      - name: ytelse
        description: 'Kode for ytelse hentet fra kobling mellom fagområde og ytelse, manuelt utledet (int_fagomrader_til_ytelser)'
      - name: gjeldende_flagg
        description: 'Flagg som tilsier om ventestatusen på stoppnivået er gjeldende/åpen'
      - name: status_registrert_dato
        description: 'Dato ventestatusen ble registrert'
      - name: handteres_manuelt_flagg
        description: 'Flagg som tilsier om ventestatusen må håndteres manuelt eller ikke (se modell int_stoppstatuskoder_manuell_handtering for detaljer)'
      - name: varighet_dager
        description: 'Varighet i antall dager for hvor lenge ventestatusen har vært gyldig for gitt beregning og stoppnivå'
      - name: antall_beregninger
        description: 'Antall beregninger'
  - name: agg_beregninger_per_ytelse_enhet_dag
    description: 'Antall beregninger gruppert på fagområde, ytelse, enhet behandler og dag'
    columns:
      - name: fagomrade_kode
        description: 'En kode som angir selve ytelsen som beregningen gjelder, f.eks. AAP for arbeidsavklaringspenger'
      - name: fagomrade_navn
        description: 'Navn/beskrivelse på fagområde'
      - name: faggruppe_navn
        description: 'Navn/beskrivelse på faggruppe'
      - name: ytelse
        description: 'Kode for ytelse hentet fra kobling mellom fagområde og ytelse, manuelt utledet (int_fagomrader_til_ytelser)'
      - name: enhet_behandler
        description: 'Enhet som behandler stoppnivået. 4819 for NØP og 8020 for NØS'
      - name: lastet_dato_kilde
        description: 'Datoen for når raden er lastet inn i kildetabellen.'
      - name: antall_beregninger
        description: 'Antall beregninger'
  - name: agg_manuelle_beregninger_per_maned
    description: 'Antall og andel manuelle beregninger per måned.'
    columns:
      - name: mnd
        description: 'Måned beregningen er registrert, trunkert til den første dagen i måneden'
      - name: manuelt_antall
        description: 'Antall manuelle beregninger'
      - name: totalt_antall
        description: 'Totalt antall beregninger'
      - name: prosent_manuelt
        description: 'Prosentandel manuelle beregninger'
  - name: agg_oppdrag_per_ytelse_kilde_dag
    description: 'Antall oppdrag per ytelse, kildesystem og dag. Ytelse hentes fra kobling mellom fagområde og ytelse. Kildesystem hentes fra oppdrag_id i stoppnivå.'
    columns:
      - name: fagomrade_kode
        description: 'En kode som angir selve ytelsen som beregningen gjelder, f.eks. AAP for arbeidsavklaringspenger'
      - name: fagomrade_navn
        description: 'Navn/beskrivelse på fagområde'
      - name: faggruppe_kode
        description: 'Kode for faggruppe. En faggruppe består av flere fagområder hvor man ønsker en samlet felles skatt- og trekkberegning. F.eks. PEN for pensjonsrelaterte ytelser'
      - name: faggruppe_navn
        description: 'Navn/beskrivelse på faggruppe'
      - name: ytelse
        description: 'Kode for ytelse hentet fra kobling mellom fagområde og ytelse, manuelt utledet (int_fagomrader_til_ytelser)'
      - name: kildesystem
        description: 'Kildesystem hentet fra kode_komponent i t_oppdrag_kilde'
      - name: dato_oppdrag_lastet
        description: 'Datoen oppdraget ble lastet inn i Oppdragssystemet. Hentes fra t_oppdrag tidspkt_reg'
      - name: antall_oppdrag
        description: 'Antall oppdrag'
